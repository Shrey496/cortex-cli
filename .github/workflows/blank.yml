name: Cortex CLI Scan Pipeline

on:
  push:
    branches: [ "main" ]
  # Allows you to click "Run workflow" manually from the Actions tab
  workflow_dispatch: 

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    env:
      CORTEX_URL: ${{ vars.CORTEX_URL }}
      API_ID: ${{ vars.API_ID }}
      API_KEY: ${{ secrets.API_KEY_X5_PROD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # Critical if you are pulling a large .tar file

      - name: Extract Image Name from Dockerfile
        id: get_name
        run: |
          # Grabs the final base image name (e.g., alpine:3.20.8)
          DOCKER_BASE=$(grep "^FROM" Dockerfile | tail -n 1 | awk '{print $2}')
          echo "IMAGE_NAME=$DOCKER_BASE" >> $GITHUB_ENV
          echo "Scanner will target: $DOCKER_BASE"

      # ==========================================
      # IMAGE SOURCING (Choose ONE block below)
      # ==========================================

      # --- OPTION A: Build from Dockerfile (Currently Active) ---
      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME . 

    # #   --- OPTION B: Load from Tar (Commented Out) ---
    #   - name: Load Tar and Force Tag
    #     run: |
    #       LOAD_OUT=$(docker load -i 04051860_2026-05-28_ubuntu.tar.gz)
    #       IMG_ID=$(echo "$LOAD_OUT" | grep -oE 'sha256:[a-f0-9]+|Loaded image: .*' | sed 's/Loaded image: //')
    #       docker tag "$IMG_ID" tartestubuntu:latest
      
      # ==========================================

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhyperscan5 jq curl

      - name: Install Cortex CLI
        run: |
          # Dynamically determine architecture (amd64/arm64)
          ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
          
          # Fetch the signed download URL
          crtx_resp=$(curl -s "$CORTEX_URL/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=$ARCH" \
            -H "x-xdr-auth-id: $API_ID" \
            -H "Authorization: $API_KEY") 
          
          # Validate response
          if [ $? -ne 0 ] || echo "$crtx_resp" | jq -e '.error_code' > /dev/null; then
            echo "Failed to retrieve CLI download link. Response: $crtx_resp"
            exit 1
          fi

          # Extract URL, download, and make executable
          crtx_url=$(echo "$crtx_resp" | jq -r ".signed_url")
          curl -L -o cortexcli "$crtx_url"
          chmod +x cortexcli
          sudo mv cortexcli /usr/local/bin/cortexcli
          cortexcli --version

      - name: Execute Cortex Image Scan
        run: |
          # Verify image is present in daemon before scan
          docker images
          
          # Run the scan against the dynamically extracted name
          sudo cortexcli --log-level debug \
            --api-base-url "$CORTEX_URL" \
            --api-key "$API_KEY" \
            --api-key-id "$API_ID" \
            image scan --timeout 600 $IMAGE_NAME